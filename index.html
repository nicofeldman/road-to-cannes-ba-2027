<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUT BA — Road to Cannes 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
:root{
  --bg:#0d0f13;
  --surface:#182430;
  --ink:#eef2f5;
  --ink-soft:#94a3ae;
  --ink-faint:#57666f;
  --line:#26333e;
  --line-strong:#3b4a56;
  --green:#28a866;
  --green-deep:#1f8452;
  --green-tint:rgba(40,168,102,0.2);
  --red:#e2685c;
  --red-tint:rgba(226,104,92,0.16);
  --salmon:#ea7d78;
  --pink:#e685c4;
  --amber:#e0a63e;
  --amber-tint:rgba(224,166,62,0.16);
  --blue:#6c9fe0;
  --blue-tint:rgba(108,159,224,0.35);
  --gray:#8894a0;
  --gray-tint:#212e3a;
}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;}

.page{max-width:1360px;margin:0 auto;padding:56px 40px 120px;}

.faith-mark{position:fixed;top:8px;right:14px;z-index:39;font-size:9px;color:#20262e;letter-spacing:.02em;pointer-events:none;user-select:none;}
.edit-toggle{
  position:fixed;top:24px;right:24px;z-index:40;
  padding:9px 18px;border-radius:999px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
}
.edit-toggle:hover{border-color:var(--ink);}
.edit-toggle.active{background:var(--green);border-color:var(--green);color:#fff;}
#exportBar{position:fixed;top:64px;right:24px;z-index:39;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.export-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-size:12px;cursor:pointer;}
.export-btn:hover{border-color:var(--ink);color:var(--ink);}
.publish-btn{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;}
.publish-btn:hover{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}

.header{text-align:center;margin-bottom:32px;}
.header-logo{height:96px;width:auto;margin-bottom:20px;}
.header-title{font-family:'Fraunces',serif;font-weight:400;font-size:20px;color:#fff;margin:0;}

.divider{border:none;border-top:1px solid var(--line);margin:32px 0;}

.section{margin-bottom:8px;}
.section-head h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 18px;}
.section-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 14px;}

.contenders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
.rtc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}

.thumb{
  position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;background:var(--surface);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:contain;}
.thumb-empty{font-size:11px;color:var(--ink-faint);letter-spacing:.02em;}
.thumb-loading{background:linear-gradient(90deg,#182430 25%,#20303c 37%,#182430 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.thumb-placeholder{border-style:dashed;border-color:var(--line);background:var(--surface);}
.placeholder-card{cursor:default;}
.rtc-empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;min-height:64px;grid-column:1/-1;}

.contender-card,.idea-card{cursor:pointer;display:flex;flex-direction:column;gap:10px;background:none;border:none;padding:0;text-align:left;}
.idea-card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;}
.idea-card-team{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  border:1px solid var(--line-strong);border-radius:999px;font-size:12px;font-weight:500;
  color:var(--ink);white-space:nowrap;background:var(--surface);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gray);flex:none;}
.dot-green{background:var(--green);}
.dot-red{background:var(--red);}
.dot-salmon{background:var(--salmon);}
.dot-amber{background:var(--amber);}
.dot-blue{background:var(--blue);}
.dot-gray{background:var(--gray);}

.rtc-btn{
  position:relative;border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--surface);
  text-align:left;cursor:pointer;transition:border-color .15s;display:block;width:100%;
}
.rtc-btn:hover{border-color:var(--ink);}
.rtc-btn.active{background:#fff;border-color:#fff;}
.rtc-btn.active .rtc-num,.rtc-btn.active .rtc-sub{color:var(--bg);}
.rtc-num{font-size:19px;font-weight:700;margin-bottom:4px;padding-right:22px;}
.rtc-sub{font-size:12px;color:var(--ink-soft);}
.rtc-add{border-style:dashed;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;min-height:64px;}
.rtc-add:hover{border-color:var(--ink);color:var(--ink);}
.rtc-edit-mini{
  position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;cursor:pointer;padding:0;
}
.rtc-edit-mini:hover{border-color:var(--ink);color:var(--ink);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.chip{
  padding:9px 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);
  font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--ink);}
.chip.active{background:#fff;border-color:#fff;color:var(--bg);}

.content-area{margin-top:36px;}
.legal-footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;color:var(--ink-faint);text-align:center;}
.content-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
.content-head h2{font-size:20px;margin:0;font-weight:700;}
.content-head-actions{display:flex;gap:10px;}
.subhead{font-size:16px;font-weight:700;margin:0 0 16px;}
.filter-message{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:20px;}

.empty-note{color:var(--ink-faint);font-size:14px;padding:20px 0;grid-column:1/-1;}
.empty-note.center{text-align:center;padding:60px 24px;border:1px dashed var(--line);border-radius:8px;}

.idea-block{border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px;cursor:pointer;}
.idea-block:hover{border-color:var(--line-strong);}
.idea-block .thumb{max-height:420px;margin-bottom:16px;}
.idea-kicker{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.01em;}
.idea-kicker-placeholder{color:var(--ink-faint);font-weight:500;}
.idea-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.tag{font-size:12px;color:var(--ink);background:var(--gray-tint);border:1px solid var(--line-strong);padding:5px 12px;border-radius:999px;font-weight:500;}
.idea-note{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.55;}
.idea-note-label{color:var(--pink);font-weight:700;}
.idea-note-council{color:var(--blue);}
.btn-edit-mini{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-soft);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}

.pick-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.team-picker{margin-bottom:0;max-height:150px;overflow-y:auto;padding:2px;}
.team-readonly{display:flex;flex-wrap:wrap;gap:6px;}
.pick-pill{padding:9px 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer;}
.pick-pill:hover{border-color:var(--ink);}
.pick-pill.active{background:#fff;border-color:#fff;color:var(--bg);}
.logo-pill{width:92px;height:64px;border-radius:10px;border:2px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:12px;cursor:pointer;flex:none;}
.logo-pill img{width:100%;height:100%;object-fit:contain;}
.logo-pill:hover{border-color:var(--ink);}
.logo-pill.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.22);}
.btn-link{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;padding:0;margin-bottom:16px;text-decoration:underline;display:inline-block;}

.modal-overlay{position:fixed;inset:0;background:rgba(4,7,10,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
.confirm-overlay{z-index:200;}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.55);}
.modal-card-lg{max-width:680px;}
.confirm-card{max-width:400px;}
.confirm-card p{font-size:14px;line-height:1.5;margin:0 0 20px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-head h3{font-size:18px;margin:0;font-weight:700;}
.modal-x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:4px 8px;}
.modal-x:hover{color:var(--ink);}
.modal-thumb{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.modal-thumb img{width:100%;height:100%;object-fit:contain;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field-check{display:flex;align-items:center;gap:8px;}
.field-check label{margin:0;text-transform:none;font-size:14px;font-weight:500;color:var(--ink);}
.field-check input{width:auto;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:6px;
  font-size:14px;color:var(--ink);background:var(--surface);
}
textarea{resize:vertical;}
input::placeholder,textarea::placeholder{color:var(--ink-faint);}
input:disabled,select:disabled,textarea:disabled{
  border-color:transparent;background:transparent;padding-left:0;color:var(--ink);opacity:1;
}
.council-block{border-left:2px solid var(--blue-tint);padding-left:16px;margin-bottom:16px;}
.modal-actions{display:flex;align-items:center;gap:10px;margin-top:8px;}
.spacer{flex:1;}
.btn-primary,.btn-outline,.btn-danger{
  padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;
}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-deep);}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--surface);border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-tint);}

@media (max-width:720px){
  .page{padding:80px 20px 100px;}
  .field-row{grid-template-columns:1fr;}
  .edit-toggle{top:16px;right:16px;padding:8px 14px;font-size:12px;}
  .modal-card{padding:20px;}
  .rtc-grid{grid-template-columns:repeat(2,1fr);}
}
@media (min-width:721px) and (max-width:1000px){
  .rtc-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>

  var rtcs = [];
  var ideas = [];
  var view = 'home';
  var activeRtcId = null;
  var activeFilter = null;
  var activeGroupValue = null;
  var editMode = false;
  var imgCache = {};

  function $(sel, root){ return (root||document).querySelector(sel); }

  function el(tag, attrs){
    var node = document.createElement(tag);
    var children = Array.prototype.slice.call(arguments, 2);
    if (attrs){
      for (var k in attrs){
        var v = attrs[k];
        if (v === undefined || v === null) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'for') node.setAttribute('for', v);
        else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
        else if (k === 'disabled' || k === 'selected' || k === 'checked'){
          if (v) node.setAttribute(k, '');
        } else {
          node.setAttribute(k, v);
        }
      }
    }
    children.forEach(function flatten(c){
      if (c === null || c === undefined) return;
      if (Array.isArray(c)){ c.forEach(flatten); return; }
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function loadAll(){
    rtcs = (SEED_DATA.rtcs || []).slice();
    ideas = (SEED_DATA.ideas || []).slice();
    imgCache = Object.assign({}, SEED_DATA.images || {});
    return Promise.resolve();
  }

  // No hay backend: los datos ya están correctos en memoria antes de llamar a esto
  // (se mutaron directo). El archivo de verdad se actualiza con "Descargar sitio actualizado".
  function persistRtcs(){ return Promise.resolve(true); }
  function persistIdeas(){ return Promise.resolve(true); }

  function exportAllData(){
    var btn = document.querySelector('.export-btn');
    if (btn){ btn.textContent = 'Exportando…'; btn.disabled = true; }
    var idsWithImages = ideas.filter(function(i){ return i.hasImage; }).map(function(i){ return i.id; });
    Promise.all(idsWithImages.map(function(id){
      return getIdeaImage(id).then(function(src){ return {id:id, src:src}; });
    })).then(function(pairs){
      var images = {};
      pairs.forEach(function(p){ if (p.src) images[p.id] = p.src; });
      var bundle = {
        exportedAt: new Date().toISOString(),
        rtcs: rtcs,
        ideas: ideas,
        images: images
      };
      var blob = new Blob([JSON.stringify(bundle, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0,10);
      a.href = url; a.download = 'road-to-cannes-export-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      if (btn){ btn.textContent = 'Exportar datos'; btn.disabled = false; }
    }).catch(function(err){
      console.error('export failed', err);
      if (btn){ btn.textContent = 'Exportar datos'; btn.disabled = false; }
      customAlert('No se pudo exportar. Probá de nuevo.');
    });
  }

  function importAllData(file){
    var btn = document.querySelector('.import-btn');
    if (btn){ btn.textContent = 'Importando…'; btn.disabled = true; }
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var bundle = JSON.parse(e.target.result);
        var incomingRtcs = bundle.rtcs || [];
        var incomingIdeas = bundle.ideas || [];
        var incomingImages = bundle.images || {};
        incomingRtcs.forEach(function(r){
          var idx = -1;
          for (var i=0;i<rtcs.length;i++){ if (rtcs[i].id === r.id){ idx = i; break; } }
          if (idx === -1) rtcs.push(r); else rtcs[idx] = r;
        });
        incomingIdeas.forEach(function(idea){
          var idx = -1;
          for (var i=0;i<ideas.length;i++){ if (ideas[i].id === idea.id){ idx = i; break; } }
          if (idx === -1) ideas.push(idea); else ideas[idx] = idea;
        });
        Object.keys(incomingImages).forEach(function(id){ imgCache[id] = incomingImages[id]; });
        if (btn){ btn.textContent = 'Importar datos'; btn.disabled = false; }
        render();
        customAlert('Importación completa: ' + incomingRtcs.length + ' convocatoria(s), ' + incomingIdeas.length + ' idea(s).');
      } catch(err){
        console.error('import failed', err);
        if (btn){ btn.textContent = 'Importar datos'; btn.disabled = false; }
        customAlert('No se pudo importar el archivo. ¿Es un export válido de esta misma app?');
      }
    };
    reader.onerror = function(){
      if (btn){ btn.textContent = 'Importar datos'; btn.disabled = false; }
      customAlert('No se pudo leer el archivo.');
    };
    reader.readAsText(file);
  }

  function downloadUpdatedSite(){
    var btn = document.querySelector('.publish-btn');
    if (btn){ btn.textContent = 'Generando…'; btn.disabled = true; }
    try {
      var idsWithImages = ideas.filter(function(i){ return i.hasImage; }).map(function(i){ return i.id; });
      var images = {};
      idsWithImages.forEach(function(id){ if (imgCache[id]) images[id] = imgCache[id]; });
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      var newDataLine = 'var SEED_DATA = ' + JSON.stringify({rtcs:rtcs, ideas:ideas, images:images}) + '; //__SEED_DATA__';
      var pattern = /var SEED_DATA = [\s\S]*?; \/\/__SEED_DATA__/;
      if (!pattern.test(html)) throw new Error('marcador __SEED_DATA__ no encontrado');
      var updated = html.replace(pattern, newDataLine);
      var blob = new Blob([updated], {type:'text/html'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(err){
      console.error('downloadUpdatedSite failed', err);
      customAlert('No se pudo generar el archivo. Probá de nuevo.');
    }
    if (btn){ btn.textContent = 'Descargar sitio actualizado'; btn.disabled = false; }
  }

  function getIdeaImage(id){
    return Promise.resolve(Object.prototype.hasOwnProperty.call(imgCache, id) ? imgCache[id] : null);

  function setIdeaImage(id, dataUrl){

  function fmtDate(iso){
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    return dd + '/' + mm;
  }

  function compressImage(file, maxWidth, quality){
    maxWidth = maxWidth || 1600; quality = quality || 0.9;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('No se pudo leer la imagen')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('No se pudo leer el archivo')); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- custom dialogs (native alert/confirm are unreliable inside sandboxed artifacts) ----------
  function customConfirm(message){
    return new Promise(function(resolve){
      var finish, onKey;
      var overlay = el('div',{class:'modal-overlay confirm-overlay', onclick:function(e){ if(e.target===overlay) finish(false); }});
      finish = function(val){ overlay.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
      onKey = function(e){ if (e.key === 'Escape') finish(false); };
      document.addEventListener('keydown', onKey);
      var card = el('div',{class:'modal-card confirm-card'},
        el('p',{}, message),
        el('div',{class:'modal-actions'},
          el('span',{class:'spacer'}),
          el('button',{class:'btn-outline', onclick:function(){finish(false);}}, 'Cancelar'),
          el('button',{class:'btn-danger', onclick:function(){finish(true);}}, 'Confirmar')
        )
      );
      overlay.appendChild(card);
      document.body.appendChild(overlay);
    });
  }
  function customAlert(message){
    return new Promise(function(resolve){
      var finish, onKey;
      var overlay = el('div',{class:'modal-overlay confirm-overlay', onclick:function(e){ if(e.target===overlay) finish(); }});
      finish = function(){ overlay.remove(); document.removeEventListener('keydown', onKey); resolve(); };
      onKey = function(e){ if (e.key === 'Escape') finish(); };
      document.addEventListener('keydown', onKey);
      var card = el('div',{class:'modal-card confirm-card'},
        el('p',{}, message),
        el('div',{class:'modal-actions'},
          el('span',{class:'spacer'}),
          el('button',{class:'btn-primary', onclick:function(){finish();}}, 'Entendido')
        )
      );
      overlay.appendChild(card);
      document.body.appendChild(overlay);
    });
  }

      case 'hay_que_hacer': return ideas.filter(function(i){ return i.tracking==='hay_que_hacer'; });
      case 'hay_que_olvidar': return ideas.filter(function(i){ return i.tracking==='hay_que_olvidar'; });

  function renderContent(){
    var area = $('#contentArea'); area.innerHTML = '';

    if (view === 'home'){
      return;
    }

    if (view === 'rtc'){
      var rtc = rtcs.filter(function(r){ return r.id===activeRtcId; })[0];
      if (!rtc){ area.appendChild(el('div',{class:'empty-note'}, 'No se encontró esa convocatoria.')); return; }
      area.appendChild(el('div',{class:'content-head'},
        el('h2',{}, rtcTitle(rtc) + (rtcSubtitle(rtc) ? ' — ' + rtcSubtitle(rtc) : '')),
        editMode ? el('div',{class:'content-head-actions'},
          el('button',{class:'btn-outline', onclick:function(){ openRtcModal(rtc); }}, 'Editar convocatoria'),
          el('button',{class:'btn-primary', onclick:function(){ openIdeaModal(null, rtc.id); }}, '+ Agregar idea')
        ) : null
      ));
      var list = ideas.filter(function(i){ return i.rtcId === rtc.id; });
      list.forEach(function(idea){ area.appendChild(ideaBlockFull(idea)); });
      if (!list.length){
        if (rtc.customTitle){
          area.appendChild(el('div',{class:'empty-note'}, 'No hay ideas cargadas todavía.'));

          var emptyGrid = el('div',{class:'idea-grid'});

          emptyGrid.appendChild(el('div',{class:'empty-note'}, 'Sin ideas todavía.'));
          area.appendChild(emptyGrid);

      return;
    }

    if (view === 'filter'){
      if (activeFilter === 'equipo' || activeFilter === 'cuenta'){
        var pickGrid = el('div',{class:'pick-grid'});
        if (activeFilter === 'equipo'){
          TEAMS.forEach(function(v){
            var isActive = activeGroupValue === v;
            pickGrid.appendChild(el('button',{class:'pick-pill' + (isActive?' active':''), onclick:function(){
              activeGroupValue = isActive ? null : v; render();
            }}, v));
          });
        } else {
          ACCOUNTS.forEach(function(acc){
            var isActive = activeGroupValue === acc.name;
            pickGrid.appendChild(el('button',{class:'logo-pill' + (isActive?' active':''), title:acc.name, onclick:function(){
              activeGroupValue = isActive ? null : acc.name; render();
            }}, el('img',{src:acc.logo, alt:acc.name})));
          });
        }
        area.appendChild(pickGrid);

        if (activeGroupValue){
          area.appendChild(el('div',{class:'subhead'}, activeGroupValue));
          var grid1 = el('div',{class:'idea-grid'});
          var matches1 = activeFilter === 'equipo'
            ? ideas.filter(function(i){ return (i.teams||[]).indexOf(activeGroupValue) !== -1; })
            : ideas.filter(function(i){ return i.account === activeGroupValue; });
          if (!matches1.length){
            appendIdeaPlaceholders(grid1, 3);
            grid1.appendChild(el('div',{class:'empty-note'}, 'Sin ideas todavía.'));
          }
          matches1.forEach(function(idea){ grid1.appendChild(ideaCardCompact(idea)); });
          area.appendChild(grid1);
        }
        return;

      var activeMeta = FILTERS.filter(function(f){ return f.id===activeFilter; })[0];
      if (activeMeta && activeMeta.message){
        area.appendChild(el('div',{class:'filter-message'}, activeMeta.message));
      }
      var matches = getFilteredIdeas(activeFilter);
      var grid2 = el('div',{class:'idea-grid'});
      if (!matches.length){
        appendIdeaPlaceholders(grid2, 3);
        grid2.appendChild(el('div',{class:'empty-note'}, 'No hay ideas en esta categoría todavía.'));
      }
      matches.forEach(function(idea){ grid2.appendChild(ideaCardCompact(idea)); });
      area.appendChild(grid2);
    }
  }

  // ---------- modals ----------
  function closeModal(){ $('#modalRoot').innerHTML = ''; }

  function openRtcModal(rtc){
    var isNew = !rtc;
    var nextNum = rtcs.length ? Math.max.apply(null, rtcs.map(function(r){ return r.number; })) + 1 : 1;
    var root = $('#modalRoot'); root.innerHTML = '';

    var numInput = el('input',{type:'number', min:'0', value: isNew ? nextNum : rtc.number});
    var dateInput = el('input',{type:'date', value: isNew ? '' : (rtc.date||'')});
    var customTitleInput = el('input',{type:'text', value: isNew ? '' : (rtc.customTitle||''), placeholder:'Ej: RTC 2026'});
    var customSubInput = el('input',{type:'text', value: isNew ? '' : (rtc.customSubtitle||''), placeholder:'Ej: Ideas que hay que volver a empujar'});

    var actions = [
      el('span',{class:'spacer'}),
      el('button',{class:'btn-outline', onclick:closeModal}, 'Cancelar'),
      el('button',{class:'btn-primary', onclick:function(){
        var num = parseInt(numInput.value, 10);
        var date = dateInput.value;
        var customTitle = customTitleInput.value.trim();
        var customSub = customSubInput.value.trim();
        if (isNaN(num)){ customAlert('Completá el número de orden.'); return; }
        if (!date && !customSub){ customAlert('Completá la fecha, o un subtítulo personalizado.'); return; }
        if (isNew){
          rtcs.push({id: uid('rtc'), number: num, date: date, customTitle: customTitle||null, customSubtitle: customSub||null});
        } else {
          rtc.number = num; rtc.date = date; rtc.customTitle = customTitle||null; rtc.customSubtitle = customSub||null;
        }
        persistRtcs().then(function(ok){
          if (!ok){ customAlert('No se pudo guardar. Probá de nuevo.'); return; }
          closeModal(); render();
        });
      }}, 'Guardar')
    ];
    if (!isNew){
      actions.unshift(el('button',{class:'btn-danger', onclick:function(){
        customConfirm('Esto borra la convocatoria y las ' + ideas.filter(function(i){return i.rtcId===rtc.id;}).length + ' idea(s) cargada(s) en ella. ¿Confirmás?').then(function(ok){
          if (!ok) return;
          var ideaIds = ideas.filter(function(i){ return i.rtcId===rtc.id; }).map(function(i){ return i.id; });
          var remainingIdeas = ideas.filter(function(i){ return i.rtcId !== rtc.id; });
          var remainingRtcs = rtcs.filter(function(r){ return r.id !== rtc.id; });
          var prevIdeas = ideas, prevRtcs = rtcs;
          ideas = remainingIdeas; rtcs = remainingRtcs;
          ideaIds.forEach(function(id){ delete imgCache[id]; });
          Promise.all([persistIdeas(), persistRtcs()])
            .then(function(results){
              if (!results[0] || !results[1]){
                ideas = prevIdeas; rtcs = prevRtcs;
                customAlert('No se pudo borrar. Probá de nuevo.');
                return;
              }
              if (activeRtcId === rtc.id){ view='home'; activeRtcId=null; }
              closeModal(); render();
            });
        });
      }}, 'Eliminar'));
    }

    var card = el('div',{class:'modal-card'},
      el('div',{class:'modal-head'}, el('h3',{}, isNew ? 'Nueva convocatoria' : 'Editar convocatoria'), el('button',{class:'modal-x', onclick:closeModal}, '×')),
      el('div',{class:'field-row'},
        el('div',{class:'field'}, el('label',{}, 'Orden'), numInput),
        el('div',{class:'field'}, el('label',{}, 'Fecha de la semana'), dateInput)
      ),
      el('div',{class:'field'}, el('label',{}, 'Título personalizado (opcional)'), customTitleInput),
      el('div',{class:'field'}, el('label',{}, 'Subtítulo personalizado (opcional)'), customSubInput),
      el('div',{class:'modal-actions'}, actions)

    root.appendChild(el('div',{class:'modal-overlay', onclick:function(e){ if (e.target===e.currentTarget) closeModal(); }}, card));
  }

      el('option',{value:'no', selected: idea.councilResult && idea.councilResult.avanza===false}, 'No avanza')
    );
    var comentariosInput = el('textarea',{rows:'2', placeholder:'Comentarios del council', disabled:readOnly}, (idea.councilResult&&idea.councilResult.comentarios)||'');
    councilBlock.appendChild(el('div',{class:'field'}, el('label',{}, 'Puntos'), puntosInput));
    councilBlock.appendChild(el('div',{class:'field'}, el('label',{}, '¿Avanza?'), avanzaSelect));
    councilBlock.appendChild(el('div',{class:'field'}, el('label',{}, 'Comentarios del council'), comentariosInput));
    councilBlock.style.display = idea.council === 'fue' ? '' : 'none';

    var councilSelect = el('select',{disabled:readOnly},
      el('option',{value:'no_aplica', selected: idea.council==='no_aplica'}, 'No aplica'),
      el('option',{value:'va_a_ir', selected: idea.council==='va_a_ir'}, 'Va a ir al council'),
      el('option',{value:'fue', selected: idea.council==='fue'}, 'Ya fue al council')
    );
    councilSelect.addEventListener('change', function(){ councilBlock.style.display = councilSelect.value==='fue' ? '' : 'none'; });

    var notaInput = el('textarea',{rows:'2', placeholder:'Nota clave', disabled:readOnly}, idea.nota||'');

    var contenderStatusSelect = el('select',{disabled:readOnly},
      el('option',{value:'presentada', selected: idea.contenderStatus==='presentada'}, 'Presentada'),
      el('option',{value:'hecha', selected: idea.contenderStatus==='hecha'}, 'Hecha'),
      el('option',{value:'no_presentada', selected: idea.contenderStatus==='no_presentada'}, 'No presentada')
    );
    var contenderStatusField = el('div',{class:'field'}, el('label',{}, 'Estado como contender'), contenderStatusSelect);
    contenderStatusField.style.display = idea.isContender ? '' : 'none';
    var contenderCheck = el('input',{type:'checkbox', id:'f-contender', disabled:readOnly});
    contenderCheck.checked = !!idea.isContender;
    contenderCheck.addEventListener('change', function(){ contenderStatusField.style.display = contenderCheck.checked ? '' : 'none'; });

    var imgPreview = el('div',{class:'modal-thumb'}, el('span',{class:'thumb-empty'}, 'Sin imagen'));
    function refreshPreview(src){
      imgPreview.innerHTML = '';
      imgPreview.appendChild(src ? el('img',{src:src}) : el('span',{class:'thumb-empty'}, 'Sin imagen'));
    }
    if (idea.hasImage) getIdeaImage(idea.id).then(refreshPreview);

    var fileInput = el('input',{type:'file', accept:'image/*', style:'display:none', onchange:function(e){
      var file = e.target.files[0];
      if (!file) return;
      compressImage(file).then(function(dataUrl){
        pendingImage = dataUrl;
        refreshPreview(dataUrl);
      }).catch(function(){ customAlert('No se pudo procesar la imagen.'); });
    }});
    var uploadBtn = el('button',{class:'btn-outline', onclick:function(){ fileInput.click(); }}, (idea.hasImage ? 'Cambiar imagen' : 'Subir imagen del board'));

    var body = el('div',{class:'modal-body'},
      el('div',{class:'field'}, el('label',{}, 'Nombre de la idea'), nombreInput),
      imgPreview,
      !readOnly ? el('div',{class:'field'}, uploadBtn, fileInput) : null,
      el('div',{class:'field'}, el('label',{}, 'RTC'), rtcSelect),
      teamPickerField,
      el('div',{class:'field'}, el('label',{}, 'Cuenta'), accountSelect),
      el('div',{class:'field-row'},
        el('div',{class:'field'}, el('label',{}, 'Estado'), trackingSelect),
        el('div',{class:'field'}, el('label',{}, 'Council'), councilSelect)
      ),
      councilBlock,
      el('div',{class:'field'}, el('label',{}, 'Nota'), notaInput),
      el('div',{class:'field field-check'}, contenderCheck, el('label',{for:'f-contender'}, 'Es posible contender')),
      contenderStatusField
    );

    var actionButtons = [
      el('span',{class:'spacer'}),
      el('button',{class:'btn-outline', onclick:closeModal}, readOnly ? 'Cerrar' : 'Cancelar')
    ];
    if (!readOnly){
      actionButtons.push(el('button',{class:'btn-primary', onclick:function(){
        idea.nombre = nombreInput.value.trim();
        idea.rtcId = rtcSelect.value;
        idea.teams = selectedTeams.slice();
        idea.account = accountSelect.value;
        idea.tracking = trackingSelect.value;
        idea.council = councilSelect.value;
        idea.councilResult = {
          puntos: puntosInput.value.trim(),
          avanza: avanzaSelect.value==='si' ? true : (avanzaSelect.value==='no' ? false : null),
          comentarios: comentariosInput.value.trim()
        };
        idea.nota = notaInput.value.trim();
        idea.isContender = contenderCheck.checked;
        idea.contenderStatus = contenderCheck.checked ? contenderStatusSelect.value : null;
        var wasNew = isNew;
        var afterImage = Promise.resolve();
        if (pendingImage){ idea.hasImage = true; afterImage = setIdeaImage(idea.id, pendingImage); }
        if (wasNew) ideas.push(idea);
        afterImage.then(persistIdeas).then(function(ok){
          if (!ok){
            if (wasNew) ideas = ideas.filter(function(i){ return i.id !== idea.id; });
            customAlert('No se pudo guardar. Probá de nuevo.');
            return;
          }
          closeModal(); render();
        });
      }}, 'Guardar'));
    }
    if (!isNew && !readOnly){
      actionButtons.unshift(el('button',{class:'btn-danger', onclick:function(){
        customConfirm('¿Eliminar esta idea?').then(function(ok){
          if (!ok) return;
          var prevIdeas = ideas;
          ideas = ideas.filter(function(i){ return i.id !== idea.id; });
          delete imgCache[idea.id];
          persistIdeas().then(function(ok){
            if (!ok){ ideas = prevIdeas; customAlert('No se pudo borrar. Probá de nuevo.'); return; }
            closeModal(); render();
          });
        });
      }}, 'Eliminar'));
    }

    var modal = el('div',{class:'modal-card modal-card-lg'},
      el('div',{class:'modal-head'}, el('h3',{}, isNew ? 'Nueva idea' : (readOnly ? 'Detalle de la idea' : 'Editar idea')), el('button',{class:'modal-x', onclick:closeModal}, '×')),
      body,
      el('div',{class:'modal-actions'}, actionButtons)
    );
    root.appendChild(el('div',{class:'modal-overlay', onclick:function(e){ if (e.target===e.currentTarget) closeModal(); }}, modal));
  }

  if (canEdit){
    $('#editToggle').addEventListener('click', function(){ editMode = !editMode; render(); });
  } else {
    var toggleEl = $('#editToggle');
    if (toggleEl) toggleEl.remove();
  }

  loadAll().then(render);
})();
</script>
</body>
</html>
